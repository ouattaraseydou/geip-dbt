name: GEIP dbt

on:

  # ============================================================
  # Déclenchement à chaque push sur main
  # ============================================================
  push:
    branches:
      - main

  # ============================================================
  # Permet de lancer le workflow manuellement depuis GitHub
  # ============================================================
  workflow_dispatch:

  # ============================================================
  # Exécution automatique tous les jours à 06:00 UTC
  # ============================================================
  schedule:
    - cron: "0 6 * * *"


jobs:

  dbt-build:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Récupération du projet GitHub
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 2. Installation de Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Installation de dbt Snowflake
      # ==========================================================

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.11.6


      # ==========================================================
      # 4. Création du profiles.yml
      # ==========================================================

      - name: Create dbt profile

        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

        run: |

          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF

          geip_dbt:

            target: dev

            outputs:

              dev:

                type: snowflake

                account: "$SNOWFLAKE_ACCOUNT"

                user: "$SNOWFLAKE_USER"

                password: "$SNOWFLAKE_PASSWORD"

                role: "$SNOWFLAKE_ROLE"

                warehouse: "$SNOWFLAKE_WAREHOUSE"

                database: "$SNOWFLAKE_DATABASE"

                schema: "$SNOWFLAKE_SCHEMA"

                threads: 4

          EOF


      # ==========================================================
      # 5. Vérification de la connexion Snowflake
      # ==========================================================

      - name: dbt debug
        run: |
          dbt debug --target dev


      # ==========================================================
      # 6. Installation des packages dbt
      # ==========================================================

      - name: dbt deps
        run: |
          dbt deps


      # ==========================================================
      # 7. Construction complète du Data Warehouse
      # ==========================================================

      - name: dbt build full refresh
        run: |
          dbt build --target dev --full-refresh


      # ==========================================================
      # 8. ENVOI DU RAPPORT PAR EMAIL
      # ==========================================================

      - name: Send email report

        if: ${{ always() }}

        uses: dawidd6/action-send-mail@v18

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "GEIP DBT - Rapport quotidien - ${{ job.status }}"

          to: ouattsahid@gmail.com

          from: "GEIP Data Pipeline <ouattsahid@gmail.com>"

          body: |

            ==========================================
            GEIP DATA PIPELINE
            ==========================================

            Bonjour,

            Voici le résultat de l'exécution automatique
            du pipeline dbt GEIP.

            ------------------------------------------
            STATUT
            ------------------------------------------

            Statut du workflow :
            ${{ job.status }}

            ------------------------------------------
            INFORMATIONS
            ------------------------------------------

            Projet :
            ${{ github.repository }}

            Branche :
            ${{ github.ref_name }}

            Déclenchement :
            ${{ github.event_name }}

            Commit :
            ${{ github.sha }}

            ------------------------------------------
            COMMANDE EXECUTÉE
            ------------------------------------------

            dbt build --target dev --full-refresh

            ------------------------------------------
            RESULTAT
            ------------------------------------------

            Si le statut est "success" :
            le pipeline dbt s'est terminé correctement.

            Si le statut est "failure" :
            une étape du pipeline a rencontré une erreur.

            ------------------------------------------
            LOGS GITHUB ACTIONS
            ------------------------------------------

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ==========================================
            GEIP - DATA ENGINEERING
            ==========================================
